if(!ld&&nw.length){seen[k]=mx(k);try{localStorage.setItem(sk(k),seen[k])}catch(e){}document.title="Monitoramento Ferraz"}return h}
function inM(d){return String(d||"").slice(0,7)==mon}
function grp(a,fn){var m={};a.forEach(function(x){var k=fn(x)||"(não informado)";m[k]=(m[k]||0)+1});return m}
function srt(m,n){return Object.keys(m).sort(function(a,b){return m[b]-m[a]||a.localeCompare(b)}).slice(0,n||99)}
function bl(m,n){var k=srt(m,n||10),mxv=k.length?m[k[0]]:1;return k.length?"<table>"+k.map(function(x){return"<tr><td>"+esc(x)+"</td><td><b>"+m[x]+'</b></td><td style="width:50%"><div class="bar" style="width:'+Math.round(m[x]/mxv*100)+'%"></div></td></tr>'}).join("")+"</table>":'<div class="empty">Sem dados.</div>'}
function pend(a,s){return a.filter(function(x){return x.status==s}).length}
function stat(){return{oc:D.occ.filter(function(o){return inM(o.data)}),sn:D.sin.filter(function(x){return inM(x.data)}),rc:D.rec.filter(function(x){return inM(x.data)}),cm:cntMes(),cars:D.mes.filter(function(x){return real(x.linhas)}).length}}
function byOp(a,o){return a.filter(function(x){return x.operador==o}).length}
function vPn(){var s=stat(),h='<div class="card row"><label>Mês<input type="month" id="pm" value="'+mon+'"></label><button class="btn g" id="pc">Copiar relatório</button></div>';
h+='<div class="kpi"><div><b>'+s.cars+"</b><span>carros assistidos (registros dia/carro)</span></div><div><b>"+s.oc.length+"</b><span>ocorrências</span></div><div><b>"+s.sn.length+"</b><span>sinistros · "+pend(s.sn,"Pendente")+" pendentes</span></div><div><b>"+s.rc.length+"</b><span>reclamações · "+pend(s.rc,"Pendente")+" pendentes</span></div></div>";
h+='<div class="card sc"><b>Por operador</b><table><tr><th>Operador</th><th>Carros assistidos</th><th>Ocorrências registradas</th><th>Sinistros tratados</th><th>Reclamações tratadas</th></tr>'+D.ops.map(function(o){return"<tr><td>"+esc(o)+"</td><td>"+s.cm[o]+"</td><td>"+byOp(s.oc,o)+"</td><td>"+byOp(s.sn,o)+"</td><td>"+byOp(s.rc,o)+"</td></tr>"}).join("")+"</table></div>";
function C(t,m,n){return'<div class="card"><b>'+t+"</b>"+bl(m,n)+"</div>"}
h+='<div class="g2">'+C("Ocorrências por tipo",grp(s.oc,function(x){return x.tipo}))+C("Chapas com mais ocorrências",grp(s.oc,function(x){return x.chapa}),10)+C("Ocorrências por linha",grp(s.oc,function(x){return x.linha}))+C("Prefixos com mais ocorrências",grp(s.oc,function(x){return x.prefixo}))+C("Sinistros por tipo",grp(s.sn,function(x){return x.tipo}))+C("Reclamações por motivo",grp(s.rc,function(x){return x.motivo}))+"</div>";
return h+'<div class="card"><b>Relatório do mês</b><textarea id="rt" readonly>'+esc(repMes(s))+"</textarea></div>"}
function repMes(s){function ls(m,n){return srt(m,n).map(function(x,i){return(i+1)+". "+x+" – "+m[x]}).join("\n")||"-"}
function li(a,fn){return a.map(fn).join("\n")||"-"}
return"RELATÓRIO MENSAL – "+mon.slice(5)+"/"+mon.slice(0,4)+"\n\nRESUMO\nCarros assistidos (registros dia/carro): "+s.cars+"\nOcorrências: "+s.oc.length+"\nSinistros: "+s.sn.length+" ("+pend(s.sn,"Pendente")+" pendentes, "+pend(s.sn,"Solucionado")+" solucionados)\nReclamações: "+s.rc.length+" ("+pend(s.rc,"Pendente")+" pendentes, "+pend(s.rc,"Solucionado")+" solucionadas)\n\nPOR OPERADOR\n"+li(D.ops,function(o){return"- "+o+": "+s.cm[o]+" carros assistidos | "+byOp(s.oc,o)+" ocorrências | "+byOp(s.sn,o)+" sinistros tratados | "+byOp(s.rc,o)+" reclamações tratadas"})+"\n\nOCORRÊNCIAS POR TIPO\n"+ls(grp(s.oc,function(x){return x.tipo}))+"\n\nCHAPAS COM MAIS OCORRÊNCIAS (top 10)\n"+ls(grp(s.oc,function(x){return x.chapa}),10)+"\n\nSINISTROS\n"+li(s.sn,function(x){return"- "+br(x.data)+" | Prefixo "+x.prefixo+" | Linha "+(x.linha||"–")+" | "+x.tipo+" | "+x.status+" | "+(x.operador||"–")})+"\n\nRECLAMAÇÕES\n"+li(s.rc,function(x){return"- "+br(x.data)+" | Prefixo "+x.prefixo+" | Linha "+(x.linha||"–")+" | "+x.motivo+" | "+x.status+" | "+(x.operador||"–")})}
function bindFeed(k){var F=FEED[k];if($("fa"))$("fa").onclick=function(){if(!V("fx").trim()||!V("fd")){toast("Informe a data e o campo "+F.lab.toLowerCase()+".",1);return}
var b={data:V("fd"),inicio:V("fh1"),fim:V("fh2"),prefixo:V("fp"),linha:V("fl"),status:"Pendente"};b[F.col]=V("fx").trim();act(function(){return api("/rest/v1/"+F.t,{m:"POST",prefer:"return=minimal",b:b})})};
[].forEach.call(document.querySelectorAll("select[data-s]"),function(e){e.onchange=function(){act(function(){return api("/rest/v1/"+F.t+"?id=eq."+e.dataset.s,{m:"PATCH",prefer:"return=minimal",b:{status:e.value,operador:ME.nome}})})}})}
function bindPn(){$("pm").onchange=function(){mon=V("pm")||mon;D.mes=[];draw();loadTab().then(draw)};$("pc").onclick=function(){try{navigator.clipboard.writeText(V("rt"));$("pc").textContent="Copiado!"}catch(e){$("rt").select()}}}
function rel(d){var cars=PFX.filter(function(p){var x=D.carros[p+"|"+d];return x&&ops(x).indexOf(ME.nome)>=0&&real(x.linhas)}),oc=D.occ.filter(function(o){return o.operador==ME.nome&&o.data==d}),sn=D.sin.filter(function(x){return x.operador==ME.nome&&x.data==d}),rc=D.rec.filter(function(x){return x.operador==ME.nome&&x.data==d});
function t2(x){return"- "+(x.inicio||"--:--")+" às "+(x.fim||"--:--")+" | Prefixo "+x.prefixo+" | Linha "+(x.linha||"–")}
return"RELATÓRIO DE PRODUTIVIDADE\nOperador: "+ME.nome+"\nData: "+br(d)+"\n\nCarros assistidos: "+cars.length+"\n"+cars.map(function(p){return"- Prefixo "+p+": "+L(p,d).join(", ")}).join("\n")+"\n\nOcorrências registradas: "+oc.length+"\n"+oc.map(function(o){return t2(o)+" | Chapa "+o.chapa+" | "+o.tipo+(o.obs?" | "+o.obs:"")}).join("\n")+"\n\nSinistros acompanhados: "+sn.length+"\n"+sn.map(function(x){return t2(x)+" | "+x.tipo+" | "+x.status}).join("\n")+"\n\nReclamações acompanhadas: "+rc.length+"\n"+rc.map(function(x){return t2(x)+" | "+x.motivo+" | "+x.status}).join("\n")}
function vRel(){return'<div class="card row"><label>Data do relatório<input type="date" id="rd" value="'+rd+'"></label><button class="btn g" id="rc">Copiar</button></div><textarea id="rt" readonly>'+esc(rel(rd))+"</textarea>"}
function bindR(){$("rd").onchange=function(){rd=V("rd")||rd;D.carros={};draw();loadTab().then(draw)};$("rc").onclick=function(){try{navigator.clipboard.writeText(V("rt"));$("rc").textContent="Copiado!"}catch(e){$("rt").select()}}}
var FEED={sin:{t:"sinistros",col:"tipo",lab:"Tipo",ph:"ex.: colisão frontal",novo:"Novo sinistro",launch:["lider","gestor"]},rec:{t:"reclamacoes",col:"motivo",lab:"Motivo",ph:"motivo da reclamação",novo:"Nova reclamação",launch:["reclamacoes","gestor"]}};
function can(k){return FEED[k].launch.indexOf(ME.papel)>=0}
function tabsFor(){var p=ME.papel,o=[["occ","Ocorrências"],["rank","Ranking"]];if(p=="lider")return[["sin","Sinistro"]];if(p=="reclamacoes")return[["rec","Reclamações"]];if(p=="operador"||p=="gestor")o.push(["cars","Carros Assistidos"]);o.push(["sin","Sinistro"],["rec","Reclamações"]);if(p=="operador")o.push(["rel","Relatório"]);if(p=="gestor")o.unshift(["pn","Painel"]);return o}
function vis(k){return tabsFor().some(function(t){return t[0]==k})}
function draw(){var v=$("v");if(!ok){$("nav").innerHTML="";v.innerHTML='<div class="card">Falta configurar o banco de dados: edite o início do <b>index.html</b> (CFG) com a URL e a chave do Supabase.</div>';return}
if(!ME){login();return}
if(!vis(tab))tab=tabsFor()[0][0];
if(tab=="sin"||tab=="rec"){v.innerHTML=vFeed(tab);bindFeed(tab)}else if(tab=="pn"){v.innerHTML=vPn();bindPn()}else if(tab=="rank"){v.innerHTML=vRank();bindF()}else if(tab=="cars"){v.innerHTML=vCars();bindC()}else if(tab=="rel"){v.innerHTML=vRel();bindR()}else{v.innerHTML=vOcc();bindO()}nav()}
if(ok&&S)boot();else draw();
</script>
