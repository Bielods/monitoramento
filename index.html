function nav(){var t=ME.papel=="lider"?[["sin","Sinistro"]]:[["occ","Ocorrências"],["rank","Ranking"],["cars","Carros Assistidos"],["sin","Sinistro"],["rel","Relatório"]],n=newN();

function filtros(){return'<div class="card row"><label>De<input type="date" id="fi" value="'+f.ini+'"></label><label>Até<input type="date" id="ff" value="'+f.fim+'"></label><label>Tipo<select id="ft"><option value="">Todos</option>'+opt(TIPOS,f.tipo)+"</select></label></div>"}

var r=Object.keys(m).map(function(k){return m[k]}).sort(function(a,b){return b.c-a.c||a.n.localeCompare(b.n)}),mx=r.length?r[0].c:1;
var h='<div class="kpi"><div><b>'+tot+"</b><span>ocorrências no filtro</span></div><div><b>"+r.length+"</b><span>chapas com registro</span></div></div>"+filtros()+'<div class="card sc">';

function vOcc(){var h='<div class="card"><div class="row"><label>Data<input type="date" id="od" value="'+today()+'"></label><label>Início<input type="time" id="oi"></label><label>Término<input type="time" id="of"></label><label>Prefixo<select id="op">'+opt(PFX)+'</select></label><label>Linha<select id="ol">'+opt(LIN.slice(0,13))+'</select></label><label>Chapa<input id="oc" placeholder="chapa"></label><label>Tipo<select id="ot">'+opt(TIPOS)+'</select></label><label style="flex:1">Observação<input id="ob"></label><button class="btn" id="add">Registrar</button></div><div class="sub" style="margin-top:8px">Operador: '+esc(ME.nome)+' (automático)</div></div>';

return h+"</div>"}
function bindO(){$("add").onclick=function(){var c=V("oc").trim();if(!c||!V("od")){toast("Informe data e chapa.",1);return}
act(function(){return api("/rest/v1/ocorrencias",{m:"POST",prefer:"return=minimal",b:{data:V("od"),inicio:V("oi"),fim:V("of"),prefixo:V("op"),linha:V("ol"),operador:ME.nome,chapa:c,tipo:V("ot"),obs:V("ob").trim()}})})};

function vSin(){var nw=D.sin.filter(function(x){return x.id>seen}).map(function(x){return x.id}),ld=ME.papel=="lider",h="";

function rel(d){var cars=PFX.filter(function(p){var x=D.carros[p+"|"+d];return x&&ops(x).indexOf(ME.nome)>=0&&real(x.linhas)}),oc=D.occ.filter(function(o){return o.operador==ME.nome&&o.data==d}),sn=D.sin.filter(function(x){return x.operador==ME.nome&&x.data==d});
return"RELATÓRIO DE PRODUTIVIDADE\nOperador: "+ME.nome+"\nData: "+br(d)+"\n\nCarros assistidos: "+cars.length+"\n"+cars.map(function(p){return"- Prefixo "+p+": "+L(p,d).join(", ")}).join("\n")+"\n\nOcorrências registradas: "+oc.length+"\n"+oc.map(function(o){return"- "+(o.inicio||"--:--")+" às "+(o.fim||"--:--")+" | Prefixo "+o.prefixo+" | Linha "+o.linha+" | Chapa "+o.chapa+" | "+o.tipo+(o.obs?" | "+o.obs:"")}).join("\n")+"\n\nSinistros acompanhados: "+sn.length+"\n"+sn.map(function(x){return"- "+(x.inicio||"--:--")+" às "+(x.fim||"--:--")+" | Prefixo "+x.prefixo+" | "+x.tipo+" | "+x.status}).join("\n")}
function vRel(){return'<div class="card row"><label>Data do relatório<input type="date" id="rd" value="'+rd+'"></label><button class="btn g" id="rc">Copiar</button></div><textarea id="rt" readonly>'+esc(rel(rd))+"</textarea>"}
function bindR(){$("rd").onchange=function(){rd=V("rd")||rd;D.carros={};draw();loadTab().then(draw)};$("rc").onclick=function(){try{navigator.clipboard.writeText(V("rt"));$("rc").textContent="Copiado!"}catch(e){$("rt").select()}}}
function draw(){var v=$("v");if(!ok){$("nav").innerHTML="";v.innerHTML='<div class="card">Falta configurar o banco de dados: edite o início do <b>index.html</b> (CFG) com a URL e a chave do Supabase.</div>';return}
if(!ME){login();return}
if(tab=="rank"){v.innerHTML=vRank();bindF()}else if(tab=="cars"){v.innerHTML=vCars();bindC()}else if(tab=="sin"){v.innerHTML=vSin();bindS()}else if(tab=="rel"){v.innerHTML=vRel();bindR()}else{tab="occ";v.innerHTML=vOcc();bindO()}nav()}
if(ok&&S)boot();else draw();
</script>
</body>
</html>
